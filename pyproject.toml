[project]
name = "pydabs-genie-agent-retarget"
version = "0.2.0"
description = "Rewrite Unity Catalog references in Genie Agent (Genie space) definitions; a PyDABs mutator for Declarative Automation Bundles"
readme = "README.md"
authors = [
    { name = "Alex Ott", email = "alexott@gmail.com" }
]
keywords = ["dabs", "genie-agents"]
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["databricks-bundles>=1.19.0"]

[project.urls]
Homepage = "https://github.com/alexott/pydabs-genie-agent-retarget"
Issues = "https://github.com/alexott/pydabs-genie-agent-retarget/issues"

[project.scripts]
dabs-genie-agent-retarget = "genie_agent_retarget:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/genie_agent_retarget.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
